[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyst"
version = "0.10.0"
description = "Personal, read-only market analysis assistant for MT5 (EURUSD, GOLD)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Windows only: the official MetaTrader 5 package.
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0"]

[project.scripts]
market-analyst = "market_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
