# Conda environment for Market Analyst.
# Create it once with:   conda env create -f environment.yml
# Then: conda activate market-analyst
#       pip install -e .   (installs this project, so the `market-analyst` command works)
name: market-analyst
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=2.0
  - numpy>=1.26
  - pyyaml>=6.0
  - matplotlib>=3.8
  - pytest>=8.0
  - pip
  - pip:
      - MetaTrader5     # official MT5 package (Windows only, pip only)
